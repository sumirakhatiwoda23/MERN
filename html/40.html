<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Flex</title>
    <style>
/* flex and grid use garney  box ma autai tarika le rakheny  */
/* grid xai vertically and horizontally ni milauney */

*{
    padding: 0;
    margin: 0;
    box-sizing: border-box;
}
.item{
    flex-basis: 200px;
    flex-grow: 1;
}

.item1{
    background-color: red;
   /* box sanao hunna if shrink 0 agryo vane */
   /* flex-shrink: 2; */
   flex-grow: 1;
}
.item2{
    background-color: blue;
    flex-grow: 1;
}
.item3{
    background-color: aqua;
}
.item4{
    background-color:violet ;
}
.item5{
    background-color: tomato;
}
.item6{
    background-color: yellowgreen;
    flex-grow: 1;
  
}
body{
    padding: 10px;

}
.flexbox{
    max-width: 700px;
    height: 400px;
    border: 1px solid black;
    display: flex;
    flex-wrap: wrap;
    /* yeti content haru matrai yeta uta garna xa vane align items navaen align contents */
    /* align-items: center; */
    align-content: start;
  
}

    </style>
</head>
<body>
    <div class="flexbox">
        <div class="item item1">
        <h3>box1</h3>
</div>
        <div class="item item2">
        <h3>box2</h3>
        </div>
        <div class="item item3">
        <h3>box3</h3>
        </div>
        <div class="item item4">
        <h3>box4</h3>
        </div>
        <div class="item item5">
        <h3>box5</h3>
        </div>
        <div class="item item6">
        <h3>box6</h3>
        </div>
 </div>
    
    </body>
    </html>
