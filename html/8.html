<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>

</head>
<style>
    /* auta z index lagayera auta nalagai */
    .box{
        height: 200px;
        width: 200px;
        background-color: red;
        position: absolute;
        z-index: 3;

    }
    .box1{
        height: 200px;
        width: 200px;
        background-color: green;
        position: absolute;
        top: 20px;
        left: 20px;
        z-index: 1;


        
    }
    .box2{
        height: 200px;
        width: 200px;
        background-color:blue;
        position: absolute;
        top: 40px;
        left: 40px;
        z-index: 2;

        
    }


</style>



<body>

<div class="box"></div>
<div class="box1"></div>
<div class="box2"></div>


    
</body>
</html>
