<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            padding: 10px;
        }
        .card{
            height: 300px;
           max-width: 400px;
            border: 1px solid black;
            position: relative;
            box-shadow: rgba(6, 24, 44, 0.4) 0px 0px 0px 2px, rgba(6, 24, 44, 0.65) 0px 4px 6px -1px, rgba(255, 255, 255, 0.08) 0px 1px 0px inset;
            border-radius: 10px;
            overflow: hidden;
            /* yo smooth xaina tara smoothness lyauna ko lagi hami animation use garxam */
        }
       
       

        img{
            width: 100%;
            height: 200px;
            overflow: hidden;
            transition: all 2s cubic-bezier(0.785, 0.135, 0.15, 0.86) 0s;
        
            
        }
        img:hover{
            scale: 1.2;
        }
        .card-info{
            padding: 5px;
            position: absolute;
            bottom: 0px;
            left: 50px;
        }

    </style>
</head>
<body>
    <div class="card">
<img src="image/jess-bailey-pSzUxQnoBUU-unsplash.jpg" alt="">
 <div class="card-info">
    <h2>Happy Birthday!</h2>
 </div>
    </div>
</body>
</html>
