<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>
    <style>
        .box{
            height: 600px;
            width: 600px;
            border: 3px solid black;
            position: relative;
        }
        .box1{
            height: 200px;
            width: 200px;
            background-color: red;
            position: absolute;
            left: 0;
            top: 0;
        }
        .box2{
            height: 200px;
            width: 200px;
            background-color: green;
            position: absolute;
            left: 200px;
            top: 200px;
        }
        .box3{
            height: 200px;
            width: 200px;
            background-color:yellow;
            position: absolute;
            left: 400px;
            top: 400px;
        }

    </style>
</head>
<body>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
    </div>
    
</body>
</html>
