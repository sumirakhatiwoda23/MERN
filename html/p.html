<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .parent {
    position: relative;  /* reference for absolute child */
    width: 300px;
    height: 200px;
    background-color: pink;
}

.child {
    position: absolute;
    top: 20px;    /* 20px from the top of parent */
    right: 10px;  /* 10px from the right of parent */
    background-color: yellow;
}

</style>
<body>
    <div class="parent"></div>
      <div class="child"></div>
    
</body>
</html>
