<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>
    <style>
*{
        margin: 0;
        padding: 0;
        box-sizing: border-box;

     }
     body{
        padding: 10px;
     }
     .box{
        height: 700px;
        width: 500px;
        border: 1px solid black;
        background-image: url(https://images.unsplash.com/photo-1764915320473-341da8000881?q=80&w=687&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
        /* object-fit: contain; */
        background-repeat: no-repeat;
        /* purai feel up garna */
        background-size: cover;
        /* sarna ko lagi position */
        /* background-position: center; */
        /* background-position: top left; */
        /* background-position: top center; */
        background-position:  center top;
        padding: 50px;
     }
     .cbx{
        backdrop-filter: blur(5px);
     }
    </style>
</head>
<body>
<div class="box">
    <div class="cbx">
 <h1>hello sumirraa</h1>
 </div>
</div>
    
</body>
</html>
