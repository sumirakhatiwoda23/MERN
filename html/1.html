<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Css</title>
</head>
<style>

    *{
        /* color: red; sabai ekaixoti rato vanna */
        margin: 0;
        padding: 0; 
    }
    /* h1{
        color: pink;
    } */




 /* direct child select */
    .box> h1{     
        color: red;
    }
    button:hover{
        background-color: red;
    }
/*     
    button:enabled{
        color: black;
    } */

    li:first-child{
        color: red;
    }
/*     
    li:last-child{
        color: brown;
    } */

    li:nth-child(3){
        color: green;
    }
    li:nth-child(even){
        color: pink;
    }
    .para::before{
        content:"Highlight";
        color: red;
        font-size: 20px;
         /* display: block;
    margin-bottom: 15px; */
    }
.para::after{
    content: "Highlight";
    color: red;
    font-size: 20px;
     display: block;
     margin-top: 20px;
    margin-bottom: 15px;


   }
   input[type="email"]:focus{
    background-color: red;
    color: black;
   }

</style>


<body>

    <br>

<input type="text">
<input type="email">
