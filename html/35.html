<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css</title>
    <style>
*{
        margin: 0;
        padding: 0;
        box-sizing: border-box;

     }
     body{
        padding: 10px;
     }
     .box{
        height: 700px;
        width: 500px;
        border: 1px solid black;
        /* background-image: url(image/jess-bailey-pSzUxQnoBUU-unsplash.jpg); */
        /* aba aru kunai image nahali ni linear gradient use garna sakinxa // css gradient in w3 schools */
          /* background-image: linear-gradient(to bottom, red, yellow); */
          background-image: linear-gradient(to left, red, yellow,purple,pink);

        /* object-fit: contain; */
        background-repeat: no-repeat;
        /* purai feel up garna */
        background-size: cover;
        background-position: center;
        padding: 240px;
        /* background ko image filter dina paryo vane
        hami suru ma background color use garxam tespaxi
        background blend mode */
        background-color: rgb(208, 200, 200);
        /* background-blend-mode: color-burn; */
        /* background-blend-mode: color-dodge; */
        background-blend-mode: darken;
     }
     .cbx{
        backdrop-filter: blur(5px);
        /* yeha ni background color change garna milxa */
        background-color: wheat;
     }
    </style>
</head>
<body>
<div class="box">
    <div class="cbx">
 <h1>hello sumirraa</h1>
 </div>
</div>
    
</body>
</html>
